name: "Run CI"

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
  push:
    branches: ['release/**']
  # Needed so cherry-pick-to-release.yml can `gh workflow run ci.yml` after
  # direct-pushing cherry-picks (GITHUB_TOKEN pushes don't auto-fire push:).
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to run CI against'
        type: string
        required: false

permissions: {}

jobs:
  code-checks:
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

